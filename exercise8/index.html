        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: linear-gradient(to bottom, #000000 0%, #05006c 100%);
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: rgb(255, 213, 0);
            text-decoration: overline;
        }

    </style>

  <body>
    <h1>Skyline</h1>
    <div class="skyline" id="skyline"></div>

    <script>
        const skyline = document.getElementById('skyline');
        const buildings = 10;

        for (let i = 0; i < buildings; i++) {
            let height = 50 + Math.floor(Math.random() * 200);

            let color;
            if (i % 3 === 0) {
                color = "gold";
            } else {
                color = "grey";
            }
        skyline.innerHTML += `
            <div style="
                width: 40px;
                height: ${height}px;
                background: ${color};
                display: inline-block;
                margin: 0px;
               "></div>`;
        }

            

    </script>
