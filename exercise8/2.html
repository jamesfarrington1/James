    <meta charset="utf-8" />

    <title>Exercise 8</title>

    <link rel="stylesheet" href="style.css">


    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: linear-gradient(to bottom, #6aff00 0%, #00fff2 100%);
            background-size: cover;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
            color: rgb(149, 0, 255);
            text-decoration: overline;
        }

    </style>
  </head>

  <body>
    <h1>Words</h1>
    <div class="words" id="words"></div>

    <script>
        let words = ["GREEN", "TURQUOISE", "VIOLET"];

        for (let i = 0; i < 16; i++) {
           let word = words[i %3];
           let size = 20 + Math.floor(Math.random() * 50);
           let rotate = Math.floor(Math.random() * 20) - 10;

           document.write(`
            <span style="
                font-size: ${size}px;
                display: inline-block;
                margin: -8px;
                transform: rotate(${rotate}deg);
            ">${word}</span>
           `);
        }

            

    </script>
